
spring.application.name=workshopmanager

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/gamini_auto_db
spring.datasource.username=gamini_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8080
